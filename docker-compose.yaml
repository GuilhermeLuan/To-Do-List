services:
  mongodb:
    container_name: mongodb-todo
    image: mongo
    ports:
      - '27017:27017'
    volumes:
      - mongodb:/data/db
    environment:
      - NAME=todo-mongodb

  mysql:
    image: mysql:9.0.1
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_USER: tarefa
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - lista-tarefa-db:/var/lib/mysql

volumes:
  mongodb:
  lista-tarefa-db: